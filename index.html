<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх / Бүртгүүлэх - Dadlaga Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="roboto-regular">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            <span class="icon-inline">
                                <i class="fa-solid fa-sack-dollar"></i>
                            </span>
                            <h3 class="auth-title mb-0">Хувийн санхүүгийн бүртгэл</h3>
                        </div>
                        <p class="text-muted text-center small mt-2 mb-4">Нэвтрэх эсвэл шинээр бүртгүүлэх</p>
                    </div>

                    <form id="auth-form">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Имэйл хаяг</label>
                            <input type="email" class="form-control form-control-lg" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Нууц үг</label>
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" id="btn-login" class="btn btn-success btn-lg fw-semibold">Нэвтрэх</button>
                            <button type="button" id="btn-register" class="btn btn-outline-secondary btn-lg fw-semibold">Шинээр бүртгүүлэх</button>
                        </div>
                    </form>

                    <div id="message" class="text-danger text-center small mt-3 fw-medium"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
